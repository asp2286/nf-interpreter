# macOS nanoCLR Build Validation
# Manual trigger only — run via Azure DevOps UI or az pipelines run
#
# What it validates:
#   1. targets/osx smoke executable builds and runs
#   2. targets/osx shared library (.dylib) exports correct P/Invoke symbols
#   3. dotnet nanoclr tool loads the .dylib via NativeNanoClrLoader

trigger: none
pr: none

jobs:

  ##############################
  # Job 1 — Build targets/osx (smoke exe + dylib)
  - job: Build_OSX
    displayName: "Build targets/osx (smoke + dylib)"
    pool:
      vmImage: "macos-15"

    steps:
      - checkout: self
        fetchDepth: 1

      - bash: |
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi
          echo "Ninja: $(ninja --version)"
          echo "CMake: $(cmake --version | head -1)"
          echo "Clang: $(clang++ --version | head -1)"
          echo "Arch:  $(uname -m)"
        displayName: Show tool versions

      - bash: |
          set -euo pipefail
          ARCH=$(uname -m)
          echo "Configuring for arch: $ARCH"

          cmake -S targets/osx \
                -B build/osx \
                -G Ninja \
                -DNANO_OSX_ARCH="${ARCH}" \
                -DNANO_OSX_ENABLE_SMOKE=ON \
                -DBUILD_VERSION="1.0.0.0" \
                --fresh
        displayName: CMake Configure

      - bash: |
          set -euo pipefail
          cmake --build build/osx --verbose
        displayName: CMake Build

      - bash: |
          set -euo pipefail

          EXE="build/osx/bin/nanoFramework.nanoCLR"
          DYLIB=$(find build/osx -name "nanoFramework.nanoCLR.dylib" | head -1)

          echo "==============================="
          echo "Smoke executable: $EXE"
          echo "==============================="
          test -f "$EXE"
          "$EXE" --version | tee smoke.log
          if ! grep -Eq '[0-9]+\.[0-9]+\.[0-9]+' smoke.log; then
            echo "ERROR: version string not found in smoke output"
            cat smoke.log
            exit 1
          fi
          echo "Smoke executable: OK"

          echo ""
          echo "==============================="
          echo "Shared library: $DYLIB"
          echo "==============================="
          test -f "$DYLIB"
          echo "Size: $(du -h "$DYLIB" | cut -f1)"

          echo ""
          echo "=== Checking P/Invoke exports ==="
          REQUIRED_SYMBOLS=(
            "nanoCLR_Run"
            "nanoCLR_LoadAssembly"
            "nanoCLR_LoadAssembliesSet"
            "nanoCLR_Resolve"
            "nanoCLR_GetVersion"
            "nanoCLR_SetConfigureCallback"
            "nanoCLR_SetDebugPrintCallback"
            "nanoCLR_WireProtocolOpen"
            "nanoCLR_WireProtocolClose"
            "nanoCLR_WireProtocolProcess"
            "nanoCLR_GetNativeAssemblyCount"
            "nanoCLR_GetNativeAssemblyInformation"
          )

          ALL_OK=true
          for SYM in "${REQUIRED_SYMBOLS[@]}"; do
            if nm -gU "$DYLIB" | grep -q "$SYM"; then
              echo "  ✓ $SYM"
            else
              echo "  ✗ $SYM  <-- MISSING"
              ALL_OK=false
            fi
          done

          if [ "$ALL_OK" = false ]; then
            echo "ERROR: some required P/Invoke symbols are missing"
            exit 1
          fi
          echo "All P/Invoke symbols present: OK"
        displayName: Smoke Run + Symbol Verification

      - task: PublishPipelineArtifact@1
        condition: always()
        displayName: Upload build artifacts
        inputs:
          targetPath: build/osx
          artifactName: osx_build
          artifactType: pipeline

  ##############################
  # Job 2 — dotnet tool end-to-end
  - job: Test_dotnet_tool
    displayName: "dotnet nanoclr tool loads dylib"
    dependsOn: Build_OSX
    pool:
      vmImage: "macos-15"

    steps:
      - checkout: self
        fetchDepth: 1

      - task: UseDotNet@2
        displayName: Use .NET 8
        inputs:
          version: "8.0.x"

      - task: DownloadPipelineArtifact@2
        displayName: Download dylib from Job 1
        inputs:
          artifactName: osx_build
          targetPath: $(Pipeline.Workspace)/osx_build

      - bash: |
          set -euo pipefail
          echo "Downloaded artifacts:"
          find $(Pipeline.Workspace)/osx_build -name "*.dylib" -o -name "nanoFramework.nanoCLR" | head -20
        displayName: Show downloaded artifacts

      - bash: |
          set -euo pipefail

          # Build only the C# projects — the .sln also contains .vcxproj
          # files which require MSVC and cannot build on macOS.
          dotnet restore \
              targets/netcore/nanoFramework.nanoCLR.Host/nanoFramework.nanoCLR.Host.csproj \
              --verbosity minimal

          dotnet restore \
              targets/netcore/nanoFramework.nanoCLR.CLI/nanoFramework.nanoCLR.CLI.csproj \
              --verbosity minimal

          dotnet build \
              targets/netcore/nanoFramework.nanoCLR.Host/nanoFramework.nanoCLR.Host.csproj \
              --configuration Debug \
              --no-restore \
              --verbosity minimal

          dotnet build \
              targets/netcore/nanoFramework.nanoCLR.CLI/nanoFramework.nanoCLR.CLI.csproj \
              --configuration Debug \
              --no-restore \
              --verbosity minimal
        displayName: Build dotnet nanoclr tool (C# only)

      - bash: |
          set -euo pipefail

          # Find CLI output directory
          CLI_DLL=$(find targets/netcore \
              -name "nanoFramework.nanoCLR.CLI.dll" \
              -path "*/Debug/*" | head -1)
          CLI_DIR=$(dirname "$CLI_DLL")
          echo "CLI dir: $CLI_DIR"

          # Copy dylib next to the tool
          DYLIB=$(find $(Pipeline.Workspace)/osx_build \
              -name "nanoFramework.nanoCLR.dylib" | head -1)
          echo "dylib: $DYLIB"
          cp "$DYLIB" "$CLI_DIR/nanoFramework.nanoCLR.dylib"
          echo "Copied dylib to CLI output dir"
        displayName: Place dylib next to tool

      - bash: |
          set -euo pipefail

          CLI_DLL=$(find targets/netcore \
              -name "nanoFramework.nanoCLR.CLI.dll" \
              -path "*/Debug/*" | head -1)
          echo "Running: $CLI_DLL"

          # Run with trace to see which library is loaded
          NANOCLR_TRACE_LOAD=1 dotnet "$CLI_DLL" instance --getversion \
              2>&1 | tee tool_output.log || true

          echo ""
          echo "=== Full output ==="
          cat tool_output.log

          echo ""
          echo "=== Verification ==="

          if grep -q "nanoCLR-loader.*selected" tool_output.log; then
            echo "✓ NativeNanoClrLoader selected a library"
          else
            echo "✗ NativeNanoClrLoader did not select a library"
            exit 1
          fi

          if grep -q "\.dylib" tool_output.log; then
            echo "✓ .dylib was loaded (not .dll)"
          else
            echo "✗ Expected .dylib to be loaded"
            exit 1
          fi

          echo ""
          echo "SUCCESS: dotnet tool loaded macOS dylib correctly"
        displayName: Run dotnet nanoclr end-to-end

      - task: PublishPipelineArtifact@1
        condition: always()
        displayName: Upload tool output
        inputs:
          targetPath: tool_output.log
          artifactName: tool_output
          artifactType: pipeline
          