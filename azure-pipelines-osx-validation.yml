# macOS nanoCLR Build Validation
# Manual trigger only — run via Azure DevOps UI or az pipelines run
#
# What it validates:
#   1. targets/osx smoke executable builds and runs
#   2. targets/osx shared library (.dylib) exports correct P/Invoke symbols
#   3. dotnet nanoclr tool loads the .dylib via NativeNanoClrLoader

trigger: none
pr: none

jobs:

  ##############################
  # Job 1 — Build targets/osx (smoke exe + dylib)
  - job: Build_OSX
    displayName: "Build targets/osx (smoke + dylib)"
    pool:
      vmImage: "macos-15"

    steps:
      - checkout: self
        fetchDepth: 1

      - bash: |
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi
          echo "Ninja: $(ninja --version)"
          echo "CMake: $(cmake --version | head -1)"
          echo "Clang: $(clang++ --version | head -1)"
          echo "Arch:  $(uname -m)"
        displayName: Show tool versions

      - bash: |
          set -euo pipefail
          ARCH=$(uname -m)
          echo "Configuring for arch: $ARCH"

          cmake -S targets/osx \
                -B build/osx \
                -G Ninja \
                -DNANO_OSX_ARCH="${ARCH}" \
                -DNANO_OSX_ENABLE_SMOKE=ON \
                -DBUILD_VERSION="1.0.0.0" \
                --fresh
        displayName: CMake Configure

      - bash: |
          set -euo pipefail
          cmake --build build/osx --verbose
        displayName: CMake Build

      - bash: |
          set -euo pipefail

          EXE="build/osx/bin/nanoFramework.nanoCLR"
          DYLIB=$(find build/osx -name "nanoFramework.nanoCLR.dylib" | head -1)

          echo "==============================="
          echo "Smoke executable: $EXE"
          echo "==============================="
          test -f "$EXE"
          "$EXE" --version | tee smoke.log
          if ! grep -Eq '[0-9]+\.[0-9]+\.[0-9]+' smoke.log; then
            echo "ERROR: version string not found in smoke output"
            cat smoke.log
            exit 1
          fi
          echo "Smoke executable: OK"

          echo ""
          echo "==============================="
          echo "Shared library: $DYLIB"
          echo "==============================="
          test -f "$DYLIB"
          echo "Size: $(du -h "$DYLIB" | cut -f1)"

          echo ""
          echo "=== Checking P/Invoke exports ==="
          REQUIRED_SYMBOLS=(
            "nanoCLR_Run"
            "nanoCLR_LoadAssembly"
            "nanoCLR_LoadAssembliesSet"
            "nanoCLR_Resolve"
            "nanoCLR_GetVersion"
            "nanoCLR_SetConfigureCallback"
            "nanoCLR_SetDebugPrintCallback"
            "nanoCLR_WireProtocolOpen"
            "nanoCLR_WireProtocolClose"
            "nanoCLR_WireProtocolProcess"
            "nanoCLR_GetNativeAssemblyCount"
            "nanoCLR_GetNativeAssemblyInformation"
          )

          ALL_OK=true
          for SYM in "${REQUIRED_SYMBOLS[@]}"; do
            if nm -gU "$DYLIB" | grep -q "$SYM"; then
              echo "  ✓ $SYM"
            else
              echo "  ✗ $SYM  <-- MISSING"
              ALL_OK=false
            fi
          done

          if [ "$ALL_OK" = false ]; then
            echo "ERROR: some required P/Invoke symbols are missing"
            exit 1
          fi
          echo "All P/Invoke symbols present: OK"
        displayName: Smoke Run + Symbol Verification

      - task: PublishPipelineArtifact@1
        condition: always()
        displayName: Upload build artifacts
        inputs:
          targetPath: build/osx
          artifactName: osx_build
          artifactType: pipeline

  ##############################
  # Job 2 — dotnet tool end-to-end
  - job: Test_dotnet_tool
    displayName: "dotnet nanoclr tool loads dylib"
    dependsOn: Build_OSX
    pool:
      vmImage: "macos-15"

    steps:
      - checkout: self
        fetchDepth: 0  # Nerdbank.GitVersioning requires full history to calculate version height

      - task: UseDotNet@2
        displayName: Use .NET 8
        inputs:
          version: "8.0.x"

      - task: DownloadPipelineArtifact@2
        displayName: Download dylib from Job 1
        inputs:
          artifactName: osx_build
          targetPath: $(Pipeline.Workspace)/osx_build

      - bash: |
          set -euo pipefail
          echo "Downloaded artifacts:"
          find $(Pipeline.Workspace)/osx_build -name "*.dylib" -o -name "nanoFramework.nanoCLR" | head -20
        displayName: Show downloaded artifacts

      - bash: |
          set -euo pipefail

          # Build only the C# projects — the .sln also contains .vcxproj
          # files which require MSVC and cannot build on macOS.
          dotnet restore \
              targets/netcore/nanoFramework.nanoCLR.Host/nanoFramework.nanoCLR.Host.csproj \
              --verbosity minimal

          dotnet restore \
              targets/netcore/nanoFramework.nanoCLR.CLI/nanoFramework.nanoCLR.CLI.csproj \
              --verbosity minimal

          dotnet build \
              targets/netcore/nanoFramework.nanoCLR.Host/nanoFramework.nanoCLR.Host.csproj \
              --configuration Debug \
              --no-restore \
              --verbosity minimal

          dotnet build \
              targets/netcore/nanoFramework.nanoCLR.CLI/nanoFramework.nanoCLR.CLI.csproj \
              --configuration Debug \
              --no-restore \
              --verbosity minimal
        displayName: Build dotnet nanoclr tool (C# only)

      - bash: |
          set -euo pipefail

          # The csproj OutputPath is build/bin/Debug/net8.0/ (not inside targets/netcore)
          CLI_DLL=$(find build/bin/Debug \
              -name "nanoFramework.nanoCLR.CLI.dll" | head -1)
          CLI_DIR=$(dirname "$CLI_DLL")
          echo "CLI dir: $CLI_DIR"

          if [ -z "$CLI_DLL" ]; then
            echo "ERROR: CLI dll not found, searching everywhere:"
            find . -name "nanoFramework.nanoCLR.CLI.dll" 2>/dev/null || true
            exit 1
          fi

          # Copy dylib next to the tool
          DYLIB=$(find $(Pipeline.Workspace)/osx_build \
              -name "nanoFramework.nanoCLR.dylib" | head -1)
          echo "dylib: $DYLIB"
          cp "$DYLIB" "$CLI_DIR/nanoFramework.nanoCLR.dylib"
          echo "Copied dylib to: $CLI_DIR"
        displayName: Place dylib next to tool

      - bash: |
          set -euo pipefail

          CLI_DLL=$(find build/bin/Debug \
              -name "nanoFramework.nanoCLR.CLI.dll" | head -1)
          echo "Running: $CLI_DLL"

          # Run with trace to see which library is loaded
          NANOCLR_TRACE_LOAD=1 dotnet "$CLI_DLL" instance --getversion \
              2>&1 | tee tool_output.log || true

          echo ""
          echo "=== Full output ==="
          cat tool_output.log

          echo ""
          echo "=== Verification ==="

          if grep -q "nanoCLR-loader.*selected" tool_output.log; then
            echo "✓ NativeNanoClrLoader selected a library"
          else
            echo "✗ NativeNanoClrLoader did not select a library"
            exit 1
          fi

          if grep -q "\.dylib" tool_output.log; then
            echo "✓ .dylib was loaded (not .dll)"
          else
            echo "✗ Expected .dylib to be loaded"
            exit 1
          fi

          echo ""
          echo "SUCCESS: dotnet tool loaded macOS dylib correctly"
        displayName: Run dotnet nanoclr end-to-end

      - task: PublishPipelineArtifact@1
        condition: always()
        displayName: Upload tool output
        inputs:
          targetPath: tool_output.log
          artifactName: tool_output
          artifactType: pipeline

      - bash: |
          set -euo pipefail

          CLI_DLL=$(find build/bin/Debug -name "nanoFramework.nanoCLR.CLI.dll" | head -1)
          CLI_DIR=$(dirname "$CLI_DLL")

          STAGING="$(pwd)/staging/nanoCLR-osx-x64"
          mkdir -p "$STAGING"

          # C# tool output (CLI + Host + all dependencies)
          cp -r "$CLI_DIR"/. "$STAGING/"

          # Native dylib alongside the tool (NativeNanoClrLoader finds it here)
          cp "$(Pipeline.Workspace)/osx_build/lib/nanoFramework.nanoCLR.dylib" "$STAGING/"

          # Smoke exe (raw C++ binary for quick native testing)
          cp "$(Pipeline.Workspace)/osx_build/bin/nanoFramework.nanoCLR" "$STAGING/"

          printf '# nanoCLR macOS x64\n\n' > "$STAGING/README.md"
          printf 'Built by CI.\n\n' >> "$STAGING/README.md"
          printf '## Run\n\n' >> "$STAGING/README.md"
          printf '    dotnet nanoFramework.nanoCLR.CLI.dll instance --getversion\n\n' >> "$STAGING/README.md"
          printf '## Contents\n\n' >> "$STAGING/README.md"
          printf '- nanoFramework.nanoCLR.dylib    native CLR library (macOS x64)\n' >> "$STAGING/README.md"
          printf '- nanoFramework.nanoCLR.CLI.dll  dotnet CLI tool\n' >> "$STAGING/README.md"
          printf '- nanoFramework.nanoCLR          standalone C++ smoke exe\n' >> "$STAGING/README.md"

          echo "Staged files:"
          ls -lh "$STAGING"
        displayName: Stage artifacts for download

      - task: PublishPipelineArtifact@1
        displayName: Publish nanoCLR-osx-x64
        inputs:
          targetPath: staging/nanoCLR-osx-x64
          artifactName: nanoCLR-osx-x64
          artifactType: pipeline

  ##############################
  # Job 3 — Build targets/osx arm64 (Apple Silicon)
  - job: Build_OSX_arm64
    displayName: "Build targets/osx (arm64 / Apple Silicon)"
    pool:
      vmImage: "macos-15"

    steps:
      - checkout: self
        fetchDepth: 1

      - bash: |
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi
          echo "Ninja: $(ninja --version)"
          echo "CMake: $(cmake --version | head -1)"
          echo "Clang: $(clang++ --version | head -1)"
          echo "Arch:  $(uname -m)"
        displayName: Show tool versions

      - bash: |
          set -euo pipefail
          # Force arm64 regardless of agent arch (cross-compile if needed)
          cmake -S targets/osx \
                -B build/osx-arm64 \
                -G Ninja \
                -DNANO_OSX_ARCH="arm64" \
                -DCMAKE_OSX_ARCHITECTURES="arm64" \
                -DNANO_OSX_ENABLE_SMOKE=ON \
                -DBUILD_VERSION="1.0.0.0" \
                --fresh
        displayName: CMake Configure (arm64)

      - bash: |
          set -euo pipefail
          cmake --build build/osx-arm64 --verbose
        displayName: CMake Build (arm64)

      - bash: |
          set -euo pipefail
          DYLIB=$(find build/osx-arm64 -name "nanoFramework.nanoCLR.dylib" | head -1)
          echo "Arch check:"
          file "$DYLIB"
          lipo -info "$DYLIB"

          echo ""
          echo "=== Checking P/Invoke exports ==="
          REQUIRED_SYMBOLS=(
            "nanoCLR_Run"
            "nanoCLR_LoadAssembly"
            "nanoCLR_GetVersion"
          )
          for SYM in "${REQUIRED_SYMBOLS[@]}"; do
            if nm -gU "$DYLIB" | grep -q "$SYM"; then
              echo "  ✓ $SYM"
            else
              echo "  ✗ $SYM  <-- MISSING"
              exit 1
            fi
          done
        displayName: Verify arm64 dylib

      - task: PublishPipelineArtifact@1
        condition: always()
        displayName: Upload arm64 build artifacts
        inputs:
          targetPath: build/osx-arm64
          artifactName: osx_build_arm64
          artifactType: pipeline

  ##############################
  # Job 4 — Universal binary (x64 + arm64 fat dylib)
  - job: Package_universal
    displayName: "Package nanoCLR-osx universal (fat binary)"
    dependsOn:
      - Build_OSX_arm64
      - Test_dotnet_tool
    pool:
      vmImage: "macos-15"

    steps:
      - task: DownloadPipelineArtifact@2
        displayName: Download x64 build
        inputs:
          artifactName: osx_build
          targetPath: $(Pipeline.Workspace)/osx_build_x64

      - task: DownloadPipelineArtifact@2
        displayName: Download arm64 build
        inputs:
          artifactName: osx_build_arm64
          targetPath: $(Pipeline.Workspace)/osx_build_arm64

      - task: DownloadPipelineArtifact@2
        displayName: Download dotnet tool dlls
        inputs:
          artifactName: nanoCLR-osx-x64
          targetPath: $(Pipeline.Workspace)/nanoCLR-osx-x64

      - bash: |
          set -euo pipefail

          DYLIB_X64=$(find $(Pipeline.Workspace)/osx_build_x64 \
              -name "nanoFramework.nanoCLR.dylib" | head -1)
          DYLIB_ARM64=$(find $(Pipeline.Workspace)/osx_build_arm64 \
              -name "nanoFramework.nanoCLR.dylib" | head -1)

          echo "x64   dylib: $(file $DYLIB_X64)"
          echo "arm64 dylib: $(file $DYLIB_ARM64)"

          lipo -create "$DYLIB_X64" "$DYLIB_ARM64" \
               -output nanoFramework.nanoCLR.universal.dylib

          echo ""
          echo "Universal dylib:"
          lipo -info nanoFramework.nanoCLR.universal.dylib
          file nanoFramework.nanoCLR.universal.dylib
          ls -lh nanoFramework.nanoCLR.universal.dylib
        displayName: lipo — create universal fat dylib

      - bash: |
          set -euo pipefail

          STAGING="$(pwd)/staging/nanoCLR-osx"
          mkdir -p "$STAGING"

          # C# tool dlls (managed — platform neutral)
          cp -r "$(Pipeline.Workspace)/nanoCLR-osx-x64"/. "$STAGING/"

          # Replace x64 dylib with universal fat binary
          cp nanoFramework.nanoCLR.universal.dylib \
             "$STAGING/nanoFramework.nanoCLR.dylib"

          echo "Universal dylib in staging:"
          lipo -info "$STAGING/nanoFramework.nanoCLR.dylib"

          printf '# nanoCLR macOS Universal (x86_64 + arm64)\n\n' > "$STAGING/README.md"
          printf 'Built by CI. Works on Intel and Apple Silicon Macs.\n\n' >> "$STAGING/README.md"
          printf '## Run\n\n' >> "$STAGING/README.md"
          printf '    dotnet nanoFramework.nanoCLR.CLI.dll instance --getversion\n\n' >> "$STAGING/README.md"
          printf '## Contents\n\n' >> "$STAGING/README.md"
          printf '- nanoFramework.nanoCLR.dylib    universal fat binary (x86_64 + arm64)\n' >> "$STAGING/README.md"
          printf '- nanoFramework.nanoCLR.CLI.dll  dotnet CLI tool\n' >> "$STAGING/README.md"
          printf '- nanoFramework.nanoCLR.Host.dll CLR host library\n' >> "$STAGING/README.md"

          echo "Staged files:"
          ls -lh "$STAGING"
        displayName: Stage universal artifacts

      - task: PublishPipelineArtifact@1
        displayName: Publish nanoCLR-osx (universal)
        inputs:
          targetPath: staging/nanoCLR-osx
          artifactName: nanoCLR-osx
          artifactType: pipeline
          